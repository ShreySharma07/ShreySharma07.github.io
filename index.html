<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Shrey Sharma</title>
<meta name="description" content="Shrey Sharma — applied AI. An oil painting by the lake; say hi."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/lake.webp">
<style>
/* Layout: the painting fills the window edge to edge; on click it dissolves and the portrait steps forward on a gold ground. */
:root {
  --dusk: #2a2a22;        /* behind the painting while it loads */
  --gold: #b7905a;        /* the portrait's own background, sampled */
  --gold-deep: #8a6a3e;
  --cream: #f6ead2;       /* paper of the speech bubble, the sky's lightest note */
  --umber: #2b2116;       /* text on cream */
  --umber-soft: #6b5a43;
  --serif: "Cormorant Garamond", "Cormorant", Garamond, "Times New Roman", serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--dusk);
  color: var(--cream);
  font-family: var(--serif);
  overflow: hidden;
  transition: background-color 1.4s ease;
}
body.met { background: var(--gold); }

/* ── the painting ── */
#paint, #fallback {
  position: fixed; inset: 0; width: 100%; height: 100%;
  display: block;
  transition: opacity 1.3s ease .2s, filter 1.3s ease .2s;
}
#fallback { object-fit: cover; object-position: 64% 50%; }
body.met #paint, body.met #fallback { opacity: 0; filter: blur(6px) saturate(1.3); pointer-events: none; }
body.hot #paint { cursor: pointer; }

.hint {
  position: fixed; z-index: 3; transform: translate(-50%, -100%);
  font: italic 600 clamp(18px, 2vw, 24px) var(--serif);
  color: var(--cream);
  text-shadow: 0 1px 10px rgba(30, 22, 10, .75);
  pointer-events: none; white-space: nowrap;
  opacity: 0; transition: opacity .6s ease;
  animation: bob 2.6s ease-in-out infinite;
}
.hint.on { opacity: .95; }
body.met .hint { opacity: 0; }
@keyframes bob { 50% { translate: 0 -5px; } }

/* ── centre stage ── */
#meet {
  position: fixed; inset: 0; z-index: 4;
  display: grid; place-items: center;
  padding-inline: 16px;
  pointer-events: none;
  opacity: 0; transition: opacity 1s ease .9s;
}
body.met #meet { opacity: 1; pointer-events: auto; }
.stage { position: relative; height: min(88vh, 900px); aspect-ratio: 3 / 4; max-width: 100%; }
.portrait {
  width: 100%; height: 100%; object-fit: cover; display: block;
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 68%, transparent 100%);
          mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 68%, transparent 100%);
  transform: scale(.94); transition: transform 1.6s cubic-bezier(.2,.7,.2,1) .9s;
}
body.met .portrait { transform: scale(1); }

.bubble {
  position: absolute; left: 76%; top: 9%;
  width: max-content; max-width: min(300px, 70vw);
  padding: 16px 22px 18px;
  background: var(--cream); color: var(--umber);
  border-radius: 22px 22px 22px 6px;
  box-shadow: 0 10px 30px rgba(60, 40, 12, .28), 0 1px 0 rgba(255,255,255,.6) inset;
  font: 600 clamp(26px, 3vw, 36px)/1.05 var(--serif);
  text-wrap: balance;
  transform-origin: 0% 100%;
  transform: scale(.5) rotate(-6deg); opacity: 0;
  transition: transform .55s cubic-bezier(.3,1.5,.5,1) 2s, opacity .3s ease 2s;
}
.bubble em { font-style: italic; color: var(--gold-deep); }
.bubble small { display: block; margin-top: 8px; font: italic 500 16px/1.2 var(--serif); color: var(--umber-soft); }
body.met .bubble { transform: none; opacity: 1; }

.placard {
  position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  font: italic 500 17px/1.25 var(--serif); color: var(--umber); text-align: right;
  opacity: 0; transition: opacity .8s ease 2.4s;
}
.placard b { font-style: normal; font-weight: 600; display: block; }
body.met .placard { opacity: .85; }

.back {
  position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  font: italic 600 20px var(--serif); color: var(--umber);
  background: none; border: 0; cursor: pointer; padding: 6px 8px;
  opacity: 0; pointer-events: none; transition: opacity .6s ease 2.2s;
}
body.met .back { opacity: .85; pointer-events: auto; }
.back:hover, .back:focus-visible { opacity: 1; text-decoration: underline; text-underline-offset: 4px; outline: none; }

/* keyboard path to the sitter */
.sitter-btn {
  position: fixed; z-index: 3; width: 1px; height: 1px; padding: 0; margin: 0;
  background: none; border: 0; opacity: 0;
}
.sitter-btn:focus-visible { width: auto; height: auto; padding: 6px 12px; opacity: 1;
  font: italic 600 20px var(--serif); color: var(--umber); background: var(--cream); border-radius: 8px; transform: translate(-50%, -50%); }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

@media (max-width: 640px) {
  .stage { height: auto; width: min(100%, 420px); }
  .bubble { left: 50%; top: -4%; transform-origin: 50% 100%; translate: -50% -100%; border-radius: 22px; }
  .placard { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .hint { animation: none; }
  .portrait { transition: none; transform: none; }
}
</style>
</head>
<body>

<h1 class="sr">Shrey Sharma</h1>

<canvas id="paint" role="img" aria-label="Oil painting: a thatched cottage among wildflowers on the left, a calm lake with mountains on the right, and a young man sitting on a rock by the water with a glowing laptop."></canvas>
<img id="fallback" src="assets/lake.webp" alt="" hidden>

<p class="hint" id="hint" aria-hidden="true">psst… say hi</p>
<button class="sitter-btn" id="sitterBtn" type="button">Say hi to Shrey</button>

<section id="meet" aria-live="polite">
  <div class="stage">
    <img class="portrait" src="assets/shrey.webp" alt="Painted portrait of Shrey, standing and waving." loading="lazy">
    <p class="bubble">hey, I'm <em>Shrey</em> — ask me anything
      <small>(the asking part arrives next)</small></p>
  </div>
</section>

<p class="placard"><b>Shrey Sharma</b>Bengaluru, 2026</p>
<button class="back" type="button" id="back">← back to the lake</button>

<script>
(() => {
  const body = document.body;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Where things are in the painting, as fractions of the image */
  const IMG = { w: 2000, h: 1091 };
  const SITTER = { x0: .585, x1: .705, y0: .70, y1: .875 };  // man on the rock
  const SCREEN = { x: .66, y: .738 };                         // laptop glow
  const HINT_AT = { x: .645, y: .655 };
  const FOCUS = { x: .64, y: .5 };  // what stays in frame on narrow screens

  /* ── cover-fit maths, shared by shader and hit-testing ── */
  let vw = innerWidth, vh = innerHeight;
  const cover = () => {
    const s = Math.max(vw / IMG.w, vh / IMG.h);
    const dw = IMG.w * s, dh = IMG.h * s;
    const ox = Math.min(0, Math.max(vw - dw, vw / 2 - FOCUS.x * dw));
    const oy = Math.min(0, Math.max(vh - dh, vh / 2 - FOCUS.y * dh));
    return { s, dw, dh, ox, oy };
  };
  const toImg = (x, y) => { const c = cover(); return { u: (x - c.ox) / c.dw, v: (y - c.oy) / c.dh }; };
  const toScreen = (u, v) => { const c = cover(); return { x: c.ox + u * c.dw, y: c.oy + v * c.dh }; };
  const onSitter = (x, y) => { const p = toImg(x, y); return p.u > SITTER.x0 && p.u < SITTER.x1 && p.v > SITTER.y0 && p.v < SITTER.y1; };

  const hint = document.getElementById('hint');
  const sitterBtn = document.getElementById('sitterBtn');
  const place = () => {
    const h = toScreen(HINT_AT.x, HINT_AT.y);
    hint.style.left = h.x + 'px'; hint.style.top = h.y + 'px';
    const b = toScreen((SITTER.x0 + SITTER.x1) / 2, (SITTER.y0 + SITTER.y1) / 2);
    sitterBtn.style.left = b.x + 'px'; sitterBtn.style.top = b.y + 'px';
  };

  /* ── meet / leave ── */
  let meltT0 = 0, melting = 0;
  const meet = () => { if (body.classList.contains('met')) return; body.classList.add('met'); melting = 1; meltT0 = performance.now(); };
  const leave = () => { body.classList.remove('met'); melting = 0; };
  sitterBtn.addEventListener('click', meet);
  document.getElementById('back').addEventListener('click', leave);
  addEventListener('keydown', e => { if (e.key === 'Escape') leave(); });

  /* ── WebGL: the painting, smeared like wet oil where the cursor drags ── */
  const cv = document.getElementById('paint');
  const gl = cv.getContext('webgl', { antialias: false, premultipliedAlpha: false });
  const MAXP = 24;

  const showFallback = () => {
    cv.hidden = true;
    const f = document.getElementById('fallback'); f.hidden = false;
    f.addEventListener('click', e => { if (onSitter(e.clientX, e.clientY)) meet(); });
    f.addEventListener('pointermove', e => body.classList.toggle('hot', onSitter(e.clientX, e.clientY)));
  };
  if (!gl) { showFallback(); place(); hint.classList.add('on'); addEventListener('resize', () => { vw = innerWidth; vh = innerHeight; place(); }); return; }

  const VS = `attribute vec2 p; varying vec2 vUv;
    void main(){ vUv = p * .5 + .5; vUv.y = 1. - vUv.y; gl_Position = vec4(p, 0., 1.); }`;
  const FS = `precision highp float;
    varying vec2 vUv;
    uniform sampler2D tex;
    uniform vec2 res;          // canvas px
    uniform vec4 fit;          // ox, oy, dw, dh (px)
    uniform float time, melt, still;
    uniform vec4 pts[${MAXP}]; // x, y (px), vx, vy (px)
    uniform float age[${MAXP}];
    uniform vec2 screenUv;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y); }

    void main(){
      vec2 px = vUv * res;
      vec2 disp = vec2(0.);
      vec2 grad = vec2(0.);
      for (int i = 0; i < ${MAXP}; i++) {
        float a = age[i];
        if (a >= 1.) continue;
        vec2 d = px - pts[i].xy;
        float r = 85. + 60. * a;                 // the smear widens as it settles
        float w = exp(-dot(d, d) / (r * r)) * pow(1. - a, 2.);
        // drag paint along the stroke: sample from behind the motion
        disp -= pts[i].zw * w * 2.6;
        // a slow ring, like a thumb pressed into wet paint
        float dl = length(d) + 1e-3;
        disp += (d / dl) * sin(dl * .09 - a * 9.) * w * 10.;
        grad += -2. * d / (r * r) * w;
      }
      // brush-scale wobble so the smear breaks up along the strokes
      vec2 n = vec2(noise(px * .03 + time * .2), noise(px * .03 + 17.3 - time * .2)) - .5;
      disp += n * length(disp) * 1.2;

      // the lake breathes a little
      vec2 iuv = (px - fit.xy) / fit.zw;
      float lake = smoothstep(.52, .56, iuv.y) * smoothstep(.54, .6, iuv.x) * (1. - smoothstep(.83, .9, iuv.y)) * (1. - still);
      disp.x += sin(iuv.y * 260. + time * 1.4) * 1.1 * lake;

      // dissolve when you meet Shrey
      disp += (vec2(noise(px * .006 + 3.), noise(px * .006 + 9.)) - .5) * melt * 70.;

      vec2 uv = (px + disp - fit.xy) / fit.zw;
      vec3 col = texture2D(tex, clamp(uv, 0., 1.)).rgb;

      // wet sheen: light from the upper right catching the disturbed paint
      float sheen = clamp(dot(grad, normalize(vec2(-.6, .8))) * 9., 0., 1.);
      col += sheen * .14 * vec3(1., .95, .85);

      // laptop screen pulses softly
      vec2 sd = (iuv - screenUv) * vec2(fit.z / fit.w, 1.);
      float glow = exp(-dot(sd, sd) / .0009) * (.55 + .45 * sin(time * 1.7)) * (1. - still * .6);
      col += glow * .16 * vec3(1., .85, .55);

      gl_FragColor = vec4(col, 1.);
    }`;

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; };
  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
    gl.linkProgram(prog); if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw gl.getProgramInfoLog(prog);
  } catch (err) { console.warn(err); showFallback(); place(); hint.classList.add('on'); return; }
  gl.useProgram(prog);

  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = n => gl.getUniformLocation(prog, n);
  const u = { res: U('res'), fit: U('fit'), time: U('time'), melt: U('melt'), still: U('still'),
              pts: U('pts'), age: U('age'), screenUv: U('screenUv') };
  gl.uniform2f(u.screenUv, SCREEN.x, SCREEN.y);
  gl.uniform1f(u.still, reduced ? 1 : 0);

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([42, 42, 34, 255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    setTimeout(() => hint.classList.add('on'), 900);
  };
  img.onerror = showFallback;
  img.src = 'assets/lake.webp';

  let dpr = 1;
  const size = () => {
    vw = innerWidth; vh = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    gl.viewport(0, 0, cv.width, cv.height);
    place();
  };
  size(); addEventListener('resize', size);

  /* ── pointer trail ── */
  const LIFE = 1700;
  const trail = [];
  let last = null;
  addEventListener('pointermove', e => {
    if (body.classList.contains('met')) return;
    body.classList.toggle('hot', onSitter(e.clientX, e.clientY));
    if (reduced) return;
    const x = e.clientX, y = e.clientY, now = performance.now();
    if (last && Math.hypot(x - last.x, y - last.y) < 10) return;
    let vx = last ? x - last.x : 0, vy = last ? y - last.y : 0;
    const m = Math.hypot(vx, vy), cap = 40;
    if (m > cap) { vx *= cap / m; vy *= cap / m; }
    trail.push({ x, y, vx, vy, t: now });
    if (trail.length > MAXP) trail.shift();
    last = { x, y };
  }, { passive: true });
  addEventListener('pointerleave', () => { last = null; body.classList.remove('hot'); });
  cv.addEventListener('click', e => { if (onSitter(e.clientX, e.clientY)) meet(); });

  const P = new Float32Array(MAXP * 4), A = new Float32Array(MAXP).fill(1);
  const frame = now => {
    const c = cover();
    for (let i = 0; i < MAXP; i++) {
      const p = trail[i];
      if (!p) { A[i] = 1; continue; }
      const a = (now - p.t) / LIFE;
      P[i*4] = p.x * dpr; P[i*4+1] = p.y * dpr; P[i*4+2] = p.vx * dpr; P[i*4+3] = p.vy * dpr;
      A[i] = Math.min(a, 1);
    }
    while (trail.length && now - trail[0].t > LIFE) trail.shift();
    const melt = melting ? Math.min((now - meltT0) / 1400, 1) : 0;
    gl.uniform2f(u.res, cv.width, cv.height);
    gl.uniform4f(u.fit, c.ox * dpr, c.oy * dpr, c.dw * dpr, c.dh * dpr);
    gl.uniform1f(u.time, reduced ? 0 : now / 1000);
    gl.uniform1f(u.melt, reduced ? 0 : melt);
    gl.uniform4fv(u.pts, P); gl.uniform1fv(u.age, A);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
