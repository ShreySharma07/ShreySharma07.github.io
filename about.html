<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>About — Shrey Sharma</title>
<meta name="description" content="About Shrey Sharma — deep learning engineer. A singularity, and the things that fell out of it."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@200;300;400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ═══ this page inverts the site: white sky, black singularity ═══ */
:root{
  --ink:#14141b;
  --ink-soft:#5c5c68;
  --ink-faint:#9a9aa6;
  --hair:#e6e6ec;
  --rainbow:linear-gradient(90deg,#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#007aff,#5856d6,#af52de);
}
html,body{background:#fff}
body{color:var(--ink);overflow:hidden}

/* ── header, light variant ─────────────────── */
.top{
  background:linear-gradient(to bottom,rgba(255,255,255,.95),rgba(255,255,255,0));
  backdrop-filter:blur(6px);
}
.mark{color:var(--ink)}
.mark svg{width:20px;height:20px;overflow:visible}
.mark-name{color:var(--ink-soft)}
.mark:hover .mark-name{color:var(--ink)}
.top nav a{color:var(--ink-faint)}
.top nav a:hover,.top nav a[aria-current]{color:var(--ink)}

/* ── the scene ─────────────────────────────── */
.cosmos{position:fixed;inset:0;z-index:10;overflow:hidden}
#hole{position:absolute;inset:0;width:100%;height:100%}

/* rainbow wash that blooms in once a star opens */
.aurora{
  position:absolute;inset:0;pointer-events:none;opacity:0;
  transition:opacity 1.1s ease;
  background:
    radial-gradient(60% 50% at 18% 22%,hsla(var(--ah,280),90%,62%,.16),transparent 70%),
    radial-gradient(55% 50% at 82% 26%,hsla(calc(var(--ah,280) + 60),90%,60%,.14),transparent 70%),
    radial-gradient(60% 55% at 50% 92%,hsla(calc(var(--ah,280) - 70),90%,60%,.14),transparent 72%);
}
.cosmos.lit .aurora{opacity:1}

/* the clickable singularity */
#singularity{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  border:0;background:transparent;padding:0;cursor:pointer;border-radius:50%;
  z-index:14;
}
#singularity:focus-visible{outline:2px solid #007aff;outline-offset:8px}

.prompt{
  position:absolute;left:50%;bottom:12vh;transform:translateX(-50%);
  z-index:14;text-align:center;
  font-family:var(--mono);font-size:.58rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--ink-faint);transition:opacity .6s ease;
}
.prompt b{
  font-weight:400;color:var(--ink);
  background:var(--rainbow);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ── the stars ─────────────────────────────── */
.stars{position:absolute;inset:0;z-index:13}
.star{
  position:absolute;left:var(--x);top:var(--y);
  transform:translate(-50%,-50%);
  border:0;background:transparent;padding:.5rem;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:.7rem;
  pointer-events:none;
}
.cosmos.open .star{pointer-events:auto}
.star[data-key="who"]    {--x:20%;--y:28%}
.star[data-key="social"] {--x:80%;--y:24%}
.star[data-key="writing"]{--x:17%;--y:73%}
.star[data-key="next"]   {--x:82%;--y:70%}

.star .inner{
  display:flex;flex-direction:column;align-items:center;gap:.7rem;
  opacity:0;transform:translate(var(--fx,0px),var(--fy,0px)) scale(.15);
  transition:opacity .55s ease,transform .95s cubic-bezier(.19,1.32,.38,1);
}
.cosmos.open .star .inner{opacity:1;transform:translate(0,0) scale(1)}
.star:nth-child(1) .inner{transition-delay:.02s}
.star:nth-child(2) .inner{transition-delay:.10s}
.star:nth-child(3) .inner{transition-delay:.18s}
.star:nth-child(4) .inner{transition-delay:.26s}

.star .dot{
  width:16px;height:16px;position:relative;display:block;
  background:hsl(var(--h),92%,55%);
  border-radius:50%;
  box-shadow:0 0 0 5px hsla(var(--h),92%,60%,.16),
             0 0 26px hsla(var(--h),92%,58%,.55);
  animation:twinkle 3.4s ease-in-out infinite;
}
.star .dot::before,.star .dot::after{
  content:'';position:absolute;left:50%;top:50%;background:hsl(var(--h),92%,58%);
  transform:translate(-50%,-50%);
}
.star .dot::before{width:46px;height:1.5px}
.star .dot::after{width:1.5px;height:46px}
.star:nth-child(2) .dot{animation-delay:.7s}
.star:nth-child(3) .dot{animation-delay:1.4s}
.star:nth-child(4) .dot{animation-delay:2.1s}
@keyframes twinkle{0%,100%{transform:scale(1);opacity:.92}50%{transform:scale(1.18);opacity:1}}

.star .lbl{
  font-family:var(--mono);font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;
  color:var(--ink-soft);white-space:nowrap;transition:color .3s ease;
}
.star:hover .lbl,.star:focus-visible .lbl{color:hsl(var(--h),80%,42%)}
.star:hover .dot{transform:scale(1.25)}
.star:focus-visible{outline:2px solid hsl(var(--h),90%,50%);outline-offset:4px;border-radius:8px}

/* ── the reveal ────────────────────────────── */
.veil2{
  position:fixed;inset:0;z-index:60;display:flex;
  align-items:center;justify-content:center;padding:6rem 5vw 4rem;
  background:rgba(255,255,255,.72);backdrop-filter:blur(9px);
  opacity:0;transition:opacity .45s ease;
}
.veil2[hidden]{display:none}   /* a class display beats [hidden] — say it explicitly */
.veil2.on{opacity:1}
.panel{
  position:relative;width:min(92vw,660px);max-height:78vh;overflow-y:auto;
  background:#fff;border:1px solid var(--hair);border-radius:4px;
  padding:3rem 2.8rem 2.6rem;
  box-shadow:0 30px 80px -30px hsla(var(--h,280),70%,40%,.35),
             0 2px 10px rgba(20,20,27,.06);
  transform:translateY(22px) scale(.985);
  transition:transform .5s cubic-bezier(.2,1.3,.4,1);
}
.veil2.on .panel{transform:none}
.panel .bar{position:absolute;left:0;right:0;top:0;height:3px;background:var(--rainbow)}
.panel h2{
  font-family:var(--serif);font-weight:400;font-size:clamp(1.7rem,4vw,2.4rem);
  letter-spacing:-.02em;margin-bottom:1.6rem;color:var(--ink);
}
.panel h2 em{
  font-style:italic;
  background:var(--rainbow);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
.panel p{
  font-family:var(--serif);font-weight:300;font-size:1rem;line-height:1.85;
  color:#4a4a56;margin-bottom:1.1rem;max-width:58ch;
}
.panel p b{color:var(--ink);font-weight:400}
.panel dl{margin:1.4rem 0 1.6rem;border-top:1px solid var(--hair)}
.panel dt{
  font-family:var(--mono);font-size:.56rem;letter-spacing:.24em;text-transform:uppercase;
  color:hsl(var(--h,280),70%,45%);padding-top:.9rem;
}
.panel dd{font-family:var(--serif);font-size:.95rem;color:#4a4a56;padding-bottom:.9rem;border-bottom:1px solid var(--hair)}
.panel .chan{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.panel .chan a{
  display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  padding:1rem .2rem;border-bottom:1px solid var(--hair);text-decoration:none;
  transition:padding .35s cubic-bezier(.2,.7,.3,1),background .35s ease;
}
.panel .chan a:hover{padding-left:.9rem;background:hsla(var(--h,280),90%,60%,.06)}
.panel .chan .n{font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
.panel .chan .v{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--ink-faint);word-break:break-all}
.panel .chan a:hover .n{color:hsl(var(--h,280),75%,45%)}
.panel .soon{
  font-family:var(--mono);font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);border:1px dashed var(--hair);padding:1.4rem;text-align:center;border-radius:3px;
}
.close{
  position:absolute;right:1rem;top:1rem;width:34px;height:34px;
  border:1px solid var(--hair);background:#fff;border-radius:50%;cursor:pointer;
  font-size:1.1rem;line-height:1;color:var(--ink-faint);
  transition:color .3s ease,border-color .3s ease;
}
.close:hover{color:var(--ink);border-color:var(--ink-faint)}

@media(max-width:860px){
  .star[data-key="who"]    {--x:23%;--y:24%}
  .star[data-key="social"] {--x:77%;--y:21%}
  .star[data-key="writing"]{--x:21%;--y:76%}
  .star[data-key="next"]   {--x:79%;--y:73%}
  .star .lbl{font-size:.52rem;letter-spacing:.18em}
  .star .dot::before{width:34px}
  .star .dot::after{height:34px}
  .panel{padding:2.6rem 1.5rem 2rem}
}
@media(prefers-reduced-motion:reduce){
  .star .inner{transition-duration:.01ms}
  .star .dot{animation:none}
}
</style>
</head>
<body>

<header class="top">
  <a class="mark" href="index.html" aria-label="Shrey Sharma — home">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <circle cx="3" cy="10" r="1.6" fill="currentColor"/>
      <circle cx="10" cy="4" r="1.6" fill="currentColor"/>
      <circle cx="10" cy="16" r="1.6" fill="currentColor"/>
      <circle cx="17" cy="10" r="1.6" fill="currentColor"/>
      <path d="M3 10 10 4M3 10 10 16M10 4 17 10M10 16 17 10" stroke="currentColor" stroke-opacity=".45" stroke-width="1"/>
    </svg>
    <span class="mark-name">Shrey Sharma</span>
  </a>
  <nav>
    <a href="about.html" aria-current="page">About</a>
    <a href="projects.html">Projects</a>
    <a href="links.html">Links</a>
  </nav>
</header>

<main id="cosmos" class="cosmos">
  <canvas id="hole" aria-label="A live black hole with a rainbow accretion disk"></canvas>
  <div class="aurora" aria-hidden="true"></div>

  <button id="singularity" aria-label="Open the singularity to reveal four stars"></button>

  <p id="prompt" class="prompt">Click the <b>singularity</b></p>

  <div id="stars" class="stars">
    <button class="star" data-key="who"     style="--h:8"   tabindex="-1" aria-hidden="true">
      <span class="inner"><span class="dot"></span><span class="lbl">Who I am</span></span>
    </button>
    <button class="star" data-key="social"  style="--h:145" tabindex="-1" aria-hidden="true">
      <span class="inner"><span class="dot"></span><span class="lbl">Socials</span></span>
    </button>
    <button class="star" data-key="writing" style="--h:212" tabindex="-1" aria-hidden="true">
      <span class="inner"><span class="dot"></span><span class="lbl">Writing</span></span>
    </button>
    <button class="star" data-key="next"    style="--h:288" tabindex="-1" aria-hidden="true">
      <span class="inner"><span class="dot"></span><span class="lbl">What's next</span></span>
    </button>
  </div>
</main>

<div id="veil" class="veil2" hidden>
  <article class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <div class="bar"></div>
    <button id="panel-close" class="close" aria-label="Close">×</button>
    <h2 id="panel-title"></h2>
    <div id="panel-body"></div>
  </article>
</div>

<script src="hole.js"></script>
</body>
</html>
